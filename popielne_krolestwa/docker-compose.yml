# Uruchomienie serwera jedną komendą:  docker compose up -d --build
services:
  server:
    build: ./server
    container_name: popielne-krolestwa-server
    restart: unless-stopped
    ports:
      - "7171:7171"
      - "7172:7172/udp"
    environment:
      - PORT=7171
      - DB_PATH=/data/game.db
      # Postacie z „darem bohatera” (poziom 100 + komplet T8), nazwy po przecinku; pusta wartość wyłącza.
      - HERO_NAMES=sazuqe
    volumes:
      - ./data:/data
    # Czas na zapisanie postaci przy zatrzymaniu kontenera.
    stop_grace_period: 15s
